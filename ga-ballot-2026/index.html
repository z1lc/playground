<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgia Ballot 2026</title>
<meta name="description" content="A neutral, source-cited comparison of the statewide, congressional and county contests on a Fulton County, Georgia ballot for the November 3, 2026 general election.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Public+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper:       #f2f3f6;
    --card:        #ffffff;
    --ink:         #12141a;
    --ink-2:       #474c58;
    --ink-3:       #757b88;
    --rule:        #e1e3e9;
    --rule-2:      #c8cbd3;
    --track:       #e3e5ea;
    --rail:        #14161d;
    --rail-ink:    #eceef3;
    --rail-ink-2:  #959cab;
    --rail-hover:  #1d2029;
    --rail-sel:    #272b37;
    --accent:      #5b3ff0;
    --accent-ink:  #ffffff;
    --accent-soft: #ebe7ff;
    --side-a:      var(--ink);
    --side-b:      var(--ink-3);
    --side-a-soft: rgb(117 123 136 / 0.07);
    --side-b-soft: transparent;
    --rep:         #d0313d;
    --dem:         #2563c4;
    --rep-soft:    rgb(208 49 61 / 0.08);
    --dem-soft:    rgb(37 99 196 / 0.08);
    --line-1:      #6250d6;
    --line-2:      #c47f00;
    --line-3:      #00958f;
    --display: "Big Shoulders Display", "Public Sans", system-ui, sans-serif;
    --stick: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --paper:       #0e1015;
      --card:        #171a21;
      --ink:         #eef0f4;
      --ink-2:       #b6bbc6;
      --ink-3:       #838a97;
      --rule:        #252935;
      --rule-2:      #363b48;
      --track:       #2a2e3a;
      --rail:        #08090d;
      --rail-ink:    #eef0f4;
      --rail-ink-2:  #878e9c;
      --rail-hover:  #13151c;
      --rail-sel:    #1c1f29;
      --accent:      #a596ff;
      --accent-ink:  #12141a;
      --accent-soft: #252040;
      --side-a:      var(--ink);
      --side-b:      var(--ink-3);
      --side-a-soft: rgb(117 123 136 / 0.10);
      --side-b-soft: transparent;
      --rep:         #ec5560;
      --dem:         #4d8ce8;
      --rep-soft:    rgb(236 85 96 / 0.12);
      --dem-soft:    rgb(77 140 232 / 0.12);
      --line-1:      #9085e9;
      --line-2:      #c98500;
      --line-3:      #0f9e93;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:       #0e1015;
    --card:        #171a21;
    --ink:         #eef0f4;
    --ink-2:       #b6bbc6;
    --ink-3:       #838a97;
    --rule:        #252935;
    --rule-2:      #363b48;
    --track:       #2a2e3a;
    --rail:        #08090d;
    --rail-ink:    #eef0f4;
    --rail-ink-2:  #878e9c;
    --rail-hover:  #13151c;
    --rail-sel:    #1c1f29;
    --accent:      #a596ff;
    --accent-ink:  #12141a;
    --accent-soft: #252040;
    --side-a:      var(--ink);
    --side-b:      var(--ink-3);
    --side-a-soft: rgb(117 123 136 / 0.10);
    --side-b-soft: transparent;
    --rep:         #ec5560;
    --dem:         #4d8ce8;
    --rep-soft:    rgb(236 85 96 / 0.12);
    --dem-soft:    rgb(77 140 232 / 0.12);
    --line-1:      #9085e9;
    --line-2:      #c98500;
    --line-3:      #0f9e93;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.55 "Public Sans", system-ui, sans-serif;
  }
  a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
  .rail {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--rail); color: var(--rail-ink);
    display: flex; flex-direction: column; padding: 26px 0 20px;
    scrollbar-color: var(--rail-sel) transparent;
  }
  .brand { padding: 0 22px 18px; }
  .brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin: 0; letter-spacing: 0.01em; }
  .brand p { margin: 6px 0 0; color: var(--rail-ink-2); font-size: 0.85rem; }
  .rail-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    color: var(--rail-ink); padding: 9px 22px; font-weight: 600; font-size: 0.92rem; border-left: 3px solid transparent;
  }
  .rail-btn:hover { background: var(--rail-hover); }
  .rail-btn[aria-current="true"] { background: var(--rail-sel); border-left-color: var(--accent); }
  .rail-label { padding: 16px 22px 6px; font-size: 0.78rem; color: var(--rail-ink-2); }
  .tabs { list-style: none; margin: 0; padding: 0; }
  .tab { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 10px; align-items: start; }
  .tab .rk { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.2; color: var(--rail-ink-2); text-align: right; }
  .tab[aria-current="true"] .rk { color: var(--rail-ink); }
  .tab .nm { font-weight: 600; font-size: 0.9rem; line-height: 1.3; display: block; }
  .tab .sb { color: var(--rail-ink-2); font-size: 0.78rem; line-height: 1.35; display: block; font-weight: 400; margin-top: 1px; }
  .tab .sb.has-pick { color: var(--rail-ink); font-weight: 700; width: fit-content; padding: 1px 6px; margin: 2px 0 1px -6px; border-radius: 4px; }
  .tab .sb[data-party="rep"] { background: #ffd4d7; color: #5c0f17; }
  .tab .sb[data-party="dem"] { background: #d2e3fc; color: #0d2f66; }
  .tab .cl { margin-top: 5px; }
  .rail-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rail-sel); }
  .rail-foot p { margin: 6px 22px 0; color: var(--rail-ink-2); font-size: 0.78rem; }

  .mobile-nav { display: none; }

  /* closeness pills + impact dots */
  .cl { display: inline-block; font-size: 0.72rem; font-weight: 650; line-height: 1.5; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
  .cl-5 { background: var(--accent); color: var(--accent-ink); }
  .cl-4 { background: var(--accent-soft); color: var(--accent); }
  .cl-3 { border-color: var(--rule-2); color: var(--ink-2); }
  .cl-2, .cl-1 { color: var(--ink-3); border-color: var(--rule); }
  .rail .cl-4 { background: #2c2552; color: #c9beff; }
  .rail .cl-5 { background: #6d55f5; color: #fff; }
  .rail .cl-3 { border-color: #3a3f4d; color: #c3c8d2; }
  .rail .cl-2, .rail .cl-1 { border-color: #262a35; color: #7f8695; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule-2); display: block; }
  .dots i.on { background: var(--ink); }

  /* ---------- main ---------- */
  main { padding: 34px 48px 96px; min-width: 0; }
  .page { max-width: 1000px; }

  /* gauge: share of the chance for each side, 50/50 tick in the middle */
  .gauge { margin-top: 20px; }
  .g-ends { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 7px; font-size: 0.95rem; color: var(--ink-2); }
  .g-ends b { font-size: 1.65rem; font-weight: 750; color: var(--ink); }
  .g-ends .g-a b { margin-right: 6px; }
  .g-ends .g-b b { margin-left: 6px; }
  .g-track { position: relative; display: flex; gap: 2px; height: 14px; }
  .g-fa { width: 50%; background: var(--side-a); border-radius: 4px 0 0 4px; transition: width 900ms cubic-bezier(.2, .8, .2, 1); }
  .g-fb { flex: 1; background: var(--side-b); border-radius: 0 4px 4px 0; }
  .g-mid { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
  .g-src { margin-top: 7px; font-size: 0.8rem; color: var(--ink-3); }
  .gauge.mini { margin: 0; }
  .gauge.mini .g-ends { font-size: 0.8rem; margin-bottom: 4px; }
  .gauge.mini .g-ends b { font-size: 0.95rem; }
  .gauge.mini .g-track { height: 8px; }
  .gauge.mini .g-mid { top: -3px; bottom: -3px; }

  /* overview */
  .ov-hero { padding: 6px 0 30px; display: grid; grid-template-columns: auto 1fr; gap: 8px 36px; align-items: end; }
  .ov-count { grid-row: 1 / span 4; margin: 0; text-align: center; line-height: 1; }
  .ov-count .big { display: block; font-family: var(--display); font-weight: 900; font-size: 8.5rem; line-height: 0.82; letter-spacing: -0.01em; color: var(--accent); }
  .ov-count .lbl { display: block; font-size: 0.9rem; color: var(--ink-2); margin-top: 10px; max-width: 9em; margin-inline: auto; }
  .ov-hero h2 { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 0.95; margin: 0; }
  .ov-lede { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 1.02rem; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; }
  .tally .cl { font-size: 0.8rem; padding: 3px 10px; }

  .board { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .row {
    width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1.25fr) minmax(0, 1fr) 150px; gap: 0 22px; align-items: center;
    text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 8px 14px 0; cursor: pointer;
  }
  .row:hover { background: var(--card); }
  .row .rk { font-family: var(--display); font-weight: 900; font-size: 2.6rem; line-height: 1; text-align: right; color: var(--ink); }
  .row-title { display: block; font-weight: 700; font-size: 1.08rem; line-height: 1.25; }
  .row-sub { display: block; color: var(--ink-2); font-size: 0.88rem; margin-top: 2px; }
  .row-pick { display: block; font-size: 0.85rem; font-weight: 700; color: var(--ink); margin-top: 3px; }
  .ov-picks { grid-column: 2; margin: 4px 0 0; font-size: 0.92rem; color: var(--ink-2); }
  .row-none { font-size: 0.82rem; color: var(--ink-3); }
  .row-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  /* contest hero */
  .hero { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 26px 30px 24px; }
  .hero-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.85rem; color: var(--ink-2); }
  .hero-top .rank { font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: var(--ink); }
  .hero-top .imp { display: inline-flex; align-items: center; gap: 6px; }
  .hero h2 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4.6vw, 3.6rem); line-height: 0.95; margin: 10px 0 0; letter-spacing: 0.005em; }
  .hero .sub { font-size: 1.15rem; color: var(--ink-2); margin: 6px 0 0; }
  .matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 0 18px; align-items: stretch; margin-top: 26px; }
  .side { border-top: 5px solid var(--side-a); padding-top: 12px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .side > div:last-child { margin-top: auto; }
  .side.b { border-top-color: var(--side-b); text-align: right; align-items: flex-end; }
  .side.n { border-top-color: var(--side-n, var(--ink-3)); }
  .side .pt { font-size: 0.85rem; color: var(--ink-2); }
  .side .cand { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 3.3vw, 2.7rem); line-height: 0.98; margin: 5px 0 7px; }
  .side .cand .age { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .side .cur { margin: 0; font-size: 0.9rem; color: var(--ink-2); }
  .side .site { font-size: 0.85rem; display: inline-block; margin-top: 6px; }
  .side { --pc: var(--side-a); }
  .side.b { --pc: var(--side-b); }
  .side.n { --pc: var(--side-n, var(--ink-3)); }
  .pick {
    margin-top: 14px; padding: 7px 16px; border: 2px solid var(--pc); border-radius: 999px; background: var(--card);
    color: var(--ink); font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
  }
  .pick:hover { background: color-mix(in srgb, var(--pc) 10%, var(--card)); }
  .pick[aria-pressed="true"] { background: var(--pc); color: var(--card); }
  .pick:disabled { opacity: 0.4; cursor: not-allowed; }
  .matchup.full .side:not(.picked) > :not(div:last-child) { opacity: 0.45; transition: opacity 200ms; }
  .side .claim { font-size: 0.98rem; color: var(--ink); margin: 6px 0 0; }
  .vs { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--ink-3); padding-bottom: 6px; align-self: center; }
  .matchup.multi { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px 22px; align-items: stretch; }
  .matchup.multi .side { text-align: left; }
  .matchup.multi .cand { font-size: clamp(1.5rem, 2.4vw, 2rem); }
  .matchup.amend { align-items: stretch; }
  .matchup.amend .side.b .claim { text-align: left; }
  .why { margin: 22px 0 0; padding: 12px 16px; background: var(--accent-soft); border-radius: 8px; font-size: 0.93rem; color: var(--ink); }
  .why b { color: var(--accent); }
  .question { margin: 18px 0 0; font-size: 1.18rem; line-height: 1.5; max-width: 62ch; padding-left: 16px; border-left: 3px solid var(--ink); }
  .q-meta { margin: 10px 0 0; font-size: 0.82rem; color: var(--ink-3); max-width: 80ch; }
  .question p { margin: 0; }
  .q-more summary { margin-top: 8px; cursor: pointer; font-size: 0.85rem; color: var(--ink-3); }
  .q-more p { margin-top: 10px; font-size: 0.95rem; color: var(--ink-2); }

  /* section pills */
  .snav {
    position: sticky; top: var(--stick); z-index: 4; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    background: var(--paper); padding: 12px 0; margin-top: 10px; border-bottom: 1px solid var(--rule);
  }
  .snav::-webkit-scrollbar { display: none; }
  .snav button {
    flex: none; border: 1px solid var(--rule-2); background: var(--card); border-radius: 999px; padding: 5px 13px;
    font-size: 0.85rem; cursor: pointer; color: var(--ink-2);
  }
  .snav button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  section { margin-top: 44px; }
  section > h3 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; margin: 0 0 16px; }
  .prose { max-width: 70ch; }
  .prose p { margin: 0 0 10px; }
  .muted { color: var(--ink-3); }
  .small { font-size: 0.85rem; }
  .job { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; }
  .job .now { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; font-size: 0.95rem; }
  .job .now b { display: block; margin-bottom: 4px; }

  sup.c { font-size: 0.68em; line-height: 0; margin-left: 1px; white-space: nowrap; }
  sup.c a { text-decoration: none; padding: 0 1px; }
  sup.c a:hover { text-decoration: underline; }
  sup.c.weak a { color: var(--ink-3); text-decoration: underline dotted; }

  /* key differences */
  .diffs { list-style: none; margin: 0; padding: 0; max-width: 80ch; }
  .diffs li { position: relative; padding: 12px 0 12px 30px; border-bottom: 1px solid var(--rule); font-size: 1.02rem; }
  .diffs li::before {
    content: ""; position: absolute; left: 0; top: 21px; width: 16px; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--side-a) 0 50%, var(--side-b) 50% 100%);
  }
  .diffs.plain li::before { background: var(--ink-3); width: 8px; height: 8px; border-radius: 50%; top: 20px; left: 4px; }

  /* issues */
  .issue-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .issue-bar .chip {
    border: 1px solid var(--rule-2); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; cursor: pointer;
  }
  .issue-bar .chip[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .issue-bar .all { margin-left: auto; background: none; border: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 0.88rem; }
  .issue { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; margin-bottom: 12px; }
  .issue h4 { font-family: var(--display); font-weight: 800; font-size: 1.55rem; line-height: 1.05; margin: 0 0 14px; }
  .pos-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 18px 26px; }
  .pos { border-left: 4px solid var(--side-a); padding-left: 14px; font-size: 1rem; }
  .pos.b { border-left-color: var(--side-b); }
  .pos.n { border-left-color: var(--side-n, var(--ink-3)); }
  .pos .who { display: block; font-weight: 700; font-size: 0.82rem; color: var(--ink-2); margin-bottom: 3px; }
  .none { color: var(--ink-3); font-style: italic; }

  /* candidate comparison grid */
  .cmp { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); column-gap: 26px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 0 22px 18px; }
  .cmp-who { position: sticky; top: calc(var(--stick) + 58px); z-index: 2; background: var(--card); padding: 14px 0 10px; border-bottom: 3px solid var(--side-a); }
  .cmp-who.b { border-bottom-color: var(--side-b); }
  .cmp-who.n { border-bottom-color: var(--side-n, var(--ink-3)); }
  .cmp-who .nm { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; display: block; }
  .cmp-label { grid-column: 1 / -1; font-weight: 700; font-size: 0.85rem; color: var(--ink-2); margin-top: 18px; padding-bottom: 4px; }
  .cmp-cell { font-size: 0.93rem; padding-top: 6px; }
  .cmp-cell ul { margin: 0; padding-left: 1.1em; }
  .cmp-cell li { margin-bottom: 5px; }
  .notice { font-size: 0.88rem; color: var(--ink-2); background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--rule-2); border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; max-width: 80ch; }

  /* for / against + amendment pairs */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pair > div { background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--ink); border-radius: 8px; padding: 14px 16px; font-size: 0.95rem; }
  .pair > div.a { border-top-color: var(--side-a); }
  .pair > div.b { border-top-color: var(--side-b); }
  .pair h4 { margin: 0 0 6px; font-size: 0.9rem; color: var(--ink-2); }
  .pair .cap { margin: -2px 0 10px; font-size: 0.85rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pair ul { margin: 0; padding-left: 1.1em; }
  .pair li { margin-bottom: 8px; }

  table.data { border-collapse: collapse; width: 100%; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.data th { font-weight: 650; color: var(--ink-2); border-bottom-color: var(--rule-2); }
  table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
  table.data td.when { white-space: nowrap; }
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  .lean { margin-top: 14px; }

  /* chart */
  .chart-card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px 12px; margin-top: 14px; }
  .chart { position: relative; }
  .chart svg { display: block; overflow: visible; }
  .chart .side-lbl { font-size: 0.8rem; color: var(--ink-2); margin: 0; display: flex; align-items: center; gap: 6px; }
  .chart .side-lbl i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart .axis text { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .grid line { stroke: var(--rule); stroke-width: 1; }
  .chart .grid line.mid { stroke: var(--ink-3); }

  "ballotText": "Shall the Constitution of Georgia, for the purpose of protecting family farmland, be amended so as to increase the maximum acreage to qualify for assessment and taxation as a bona fide conservation use property from 2,000 acres to 4,000 acres?",
  "legislation": {
   "text": "HR 32 (2025 session; Ga. L. 2025, p. 1081), lead sponsor Rep. Chuck Efstration (R). Passed House 168–5 (Mar 3, 2025) and Senate 50–1 (Mar 18, 2025).",
   "url": "https://www.legis.ga.gov/legislation/69433"

  "enabling": {
   "text": "HB 90 (2025, Act 78) raises the statutory per-owner cap in O.C.G.A. 48-5-7.4 from 2,000 to 4,000 acres. It takes effect Jan 1, 2027 only if voters ratify; otherwise it is repealed. It passed the House 111–62 and the Senate 47–3.",

   "text": "Raises the cap on farm and timber land one owner can enroll in conservation-use assessment from 2,000 to 4,000 acres. HB 90 then takes effect Jan 1, 2027.",

  },
  "no": {

  "id": "amendment-3",

  "title": "Amendment 3",
  "subtitle": "Next Generation 9-1-1 Fund",
  "ballotText": "Shall the Constitution of Georgia be amended so as to authorize the General Assembly to dedicate certain existing revenues, including revenues reallocated by law, to a nonlapsing fund to be used exclusively for the expansion, maintenance, and operation of emergency 9-1-1 systems in this state?",
  "legislation": {
   "text": "HR 1243 (2026; Ga. L. 2026, p. 1109), lead sponsor Rep. Chuck Martin (R-Alpharetta), co-sponsored by Speaker Jon Burns. House 162–0 (Mar 4, 2026). The Senate first fell short at 31–14 (Mar 19), then adopted it 49–0 (Mar 31, 2026).",
   "url": "https://www.legis.ga.gov/legislation/72891"
  },
  "enabling": {
   "text": "No enabling law has passed. The amendment only authorizes a future law. A 2025 House study committee recommended replacing local 9-1-1 fees with a state fee of no more than $1.50, deposited in a protected trust fund from about FY2028.",
   "url": "https://www.legis.ga.gov/api/document/docs/default-source/house-study-committee-document-library-page/2025/next-gen-911/funding-for-ng911-house-study-committee-final-report.pdf?sfvrsn=d55b4c7_4"
  },
  "yes": {
   "text": "The General Assembly may create a Georgia Next Generation 9-1-1 Fund by law and dedicate specified revenues to it. The money could be spent only on 9-1-1 systems, and unspent balances would carry over.",
   "url": "https://www.legis.ga.gov/api/legislation/document/20252026/248550"
  },
  "no": {
   "text": "No dedicated state 9-1-1 fund is authorized. Local governments keep imposing 9-1-1 fees, which are distributed to local 9-1-1 funds under current law.",
   "url": "https://www.legis.ga.gov/api/document/docs/default-source/house-study-committee-document-library-page/2025/next-gen-911/funding-for-ng911-house-study-committee-final-report.pdf?sfvrsn=d55b4c7_4"
  },
  "currentLaw": {
   "text": "Local governments levy $1.50 a month per phone line and $1.50 per prepaid purchase. The Department of Revenue collects the fees and passes most of them to local 9-1-1 funds. Fees raise about $250M a year and cover about 55% of 9-1-1 center budgets.",
   "url": "https://www.legis.ga.gov/api/document/docs/default-source/house-study-committee-document-library-page/2025/next-gen-911/funding-for-ng911-house-study-committee-final-report.pdf?sfvrsn=d55b4c7_4"
  },
  "change": {
   "text": "Adds Art. III, Sec. IX, Para. VI(s). Fund money is limited to 9-1-1 expansion, maintenance, operation and the move to NG911, and any other appropriation from it is void. Deposits do not lapse and are exempt from the Constitution's limits on dedicating revenue.",
   "url": "https://www.legis.ga.gov/api/legislation/document/20252026/248550"
  },
  "fiscal": {
   "text": "Approval would not by itself change the $1.50 fee Georgians pay on phone bills. Future laws would set the fund's revenue sources and how it is managed.",
   "url": "https://www.ajc.com/politics/2026/08/here-are-state-constitutional-amendments-georgians-will-vote-on-in-november/"
  },
  "support": [
   {
    "who": "Rep. Chuck Martin (R-Alpharetta), sponsor",
    "argument": "Says NG911 would let responders see video of scenes before arriving: \"It makes the first responders safer and gives them the ability to react to the situation.\"",
    "url": "https://capitol-beat.org/2026/03/georgia-lawmakers-put-911-upgrades-on-this-years-ballot/"
   },
   {
    "who": "Sen. Harold Jones II (D-Augusta), Senate minority leader",
    "argument": "Says some 911 callers get no answer and the system is \"not quite up to the quality level\"; the fund could improve response times.",
    "url": "https://capitol-beat.org/2026/03/georgia-lawmakers-put-911-upgrades-on-this-years-ballot/"
   },
   {
    "who": "Georgia Municipal Association",
    "argument": "Lists its position on HR 1243 as \"Support.\"",
    "url": "https://billtracker.gacities.com/legislation/72891"
   },
   {
    "who": "House Study Committee on Funding for NG911 (2025)",
    "argument": "Recommended a constitutionally protected 9-1-1 trust fund to steady funding and keep fees from going to unrelated expenses.",
    "url": "https://www.legis.ga.gov/api/document/docs/default-source/house-study-committee-document-library-page/2025/next-gen-911/funding-for-ng911-house-study-committee-final-report.pdf?sfvrsn=d55b4c7_4"
   }
  ],
  "oppose": [
   {
    "who": "Senate Democrats (Mar 19, 2026 vote only)",
    "argument": "Voted 14 no, saying they were not consulted and the policy itself was not the issue. Sen. Derek Mallow: \"I absolutely support law enforcement. I support 911.\" The later vote was 49–0.",
    "url": "https://theaugustapress.com/georgians-will-consider-three-constitutional-amendments-in-november/"
   }
  ],
  "closeness": {
   "summary": "No public polling found. Ballotpedia counts 112 of 139 Georgia statewide ballot measures passing from 1985 to 2024 (80.6%). Voters rejected the 2016 Opportunity School District amendment (about 60% no); all three 2024 measures passed.",
   "polls": [],
   "lean": null
  },
  "notes": [
   "\"Nonlapsing\" means unspent money stays in the fund. Normally, unspent state appropriations lapse and are no longer available when the fiscal year's budget act expires.",
   "Fee diversion: a 2013 FCC report listed Georgia among states using 9-1-1 fees for other purposes. The GAO found six states, including Georgia, used almost $77M that way in 2011.",
   "The 2025 House study committee said Georgia is not currently listed as a diverter but has been placed on the FCC list several times since 2010.",

  "id": "esplost",

  "title": "School sales tax (E-SPLOST)",
  "subtitle": "Renew Fulton's 1% sales tax for schools",
  "ballotText": "Shall the special one percent sales and use tax for educational purposes currently imposed in Fulton County be reimposed on July 1 2027 upon the expiration of the currently imposed tax, for not longer than 20 consecutive calendar quarters, to raise not more than $2,095,680,577.00 to be used for the following educational purposes:\n\nFor the Fulton County School District: (A) for acquiring, reconfiguring and developing land for, constructing and equipping, new and replacement schools and support facilities; (B) adding to, upgrading, reconfiguring, renovating, replacing, modifying and equipping existing and replacement schools, support facilities and athletic facilities; (C) making technology improvements and safety and security improvements for schools and facilities; and (D) replacing, purchasing, upgrading or supplementing capital equipment as needed, including without limitation furniture, multi-year textbooks, instructional resources, physical educational equipment, band and music equipment, audio visual equipment, equipment that supports learning and similar equipment; and (E) acquiring and equipping school buses, school police vehicles, support vehicles, transportation vehicles and other capital equipment; in an amount not to exceed $1,306,195,350.00 for the Fulton County School District, all as more fully described in the Notice of Election.\n\nFor the Atlanta Independent School System: (A) for acquiring, reconfiguring and developing land for, constructing and equipping, new and replacement schools and support facilities; (B) adding to, upgrading, reconfiguring, renovating, replacing, modifying and equipping existing and replacement schools, support facilities and athletic facilities; (C) making technology improvements and safety and security improvements for schools and facilities; (D) replacing, purchasing, upgrading or supplementing capital equipment as needed, including without limitation furniture, multi-year textbooks, instructional resources, physical educational equipment, band and music equipment, audio visual equipment, equipment that supports learning and similar equipment; and (E) acquiring and equipping school buses, school police vehicles, support vehicles, transportation vehicles and other capital equipment; at a total maximum cost of $789,485,227.00, for the Atlanta Independent School System as more fully described in the Notice of Election. If the imposition of the tax is approved by the majority of the qualified voters residing in Fulton County, such vote shall also constitute approval of the issuance of general obligation debt of the Atlanta Independent School System in the principal amount of up to $350,000,000.00 payable from its portion of the tax for the purpose of funding all or a portion of the APS Projects located in Fulton County.",

   "text": "A Yes vote also lets APS borrow up to $350 million in general obligation bonds (6% maximum interest) to build projects \"as soon as possible,\" repaid from its tax share in 2028-2032. Any shortfall would be covered by a property tax levy within Atlanta.",

   "url": "https://www.cityofsouthfultonga.gov/DocumentCenter/View/5401/ESPLOST---Call-for-Election---1122021"

   "url": "https://simbli.eboardsolutions.com/Meetings/Attachment.aspx?S=36031609&AID=2030725&MID=137179"

<script>

const choicesOf = c => c.kind === "amendment" ? ["Yes", "No"] : c.candidates.map(x => x.name);
const seatsOf = c => c.seats || 1;

// ---------- DOM helpers ----------
function el(tag, props, ...kids) {

}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...kids) {

const SURNAME = { "Bárbara Rivera Holmes": "Rivera Holmes" };  // two-part surnames the last-word rule would cut

const PARTY_VAR = { R: "rep", D: "dem" };

// ---------- citations: numbered per page, each claim links straight to its source ----------
function citer(labels) {
  const list = [];
  const index = new Map();
  function cite(url, weak) {
    if (!url) return null;
    if (!index.has(url)) { list.push({ url, weak: !!weak }); index.set(url, list.length); }
    const n = index.get(url);
    return el("sup", { class: "c" + (weak ? " weak" : "") },
      el("a", { href: url, target: "_blank", rel: "noopener", title: weak ? "Secondary source" : (labels.get(url) || hostOf(url)) }, `[${n}]`));
  }
  function render() {
    return el("ol", { class: "sources" }, list.map(s => el("li", {},
      el("a", { href: s.url, target: "_blank", rel: "noopener" }, labels.get(s.url) || pathLabel(s.url)),
      " ", el("span", { class: "host" }, hostOf(s.url) + (s.weak ? " (secondary source)" : "")))));

}
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } }

    const u = new URL(url);
    const seg = u.pathname.split("/").filter(Boolean).pop() || u.hostname;
    return decodeURIComponent(seg).replace(/\.(html?|php|aspx)$/i, "").replace(/[-_]+/g, " ").slice(0, 90) || u.hostname;
  } catch (e) { return url; }
}
function collectLabels(c) {
  const m = new Map();
  const add = arr => (arr || []).forEach(s => s && s.url && s.label && m.set(s.url, s.label));
  add(c.office && c.office.sources); add(c.noteSources);
  (c.candidates || []).forEach(x => { const a = AGES[x.name]; if (a && a.url && a.label && !m.has(a.url)) m.set(a.url, a.label); });

}
// a claim: {text, url, weak} -> text node + citation
function claim(item, cite) {
  if (!item) return null;
  if (typeof item === "string") return document.createTextNode(item);
  const frag = document.createDocumentFragment();
  frag.append(item.text || "");
  const s = cite(item.url, item.weak);

}
const isNone = item => item && /^No stated position found/i.test(item.text || "");

// ---------- ages: exact from a published birth date; the higher possible age when only a birth year or a dated "age N" exists ----------
function fullYears(from, to) {
  let y = to.getFullYear() - from.getFullYear();
  if (to.getMonth() < from.getMonth() || (to.getMonth() === from.getMonth() && to.getDate() < from.getDate())) y--;
  return y;
}
function ageOf(name) {
  const a = AGES[name];
  if (!a) return null;
  const now = new Date();
  let earliest, latest, basis;
  if (a.born) {
    const [y, m, d] = a.born.split("-").map(Number);
    earliest = new Date(y, m ? m - 1 : 0, d || 1);
    latest = d ? earliest : m ? new Date(y, m, 0) : new Date(y, 11, 31);
    basis = d ? `born ${earliest.toLocaleDateString("en-US", { dateStyle: "long" })}`
      : `born ${m ? earliest.toLocaleDateString("en-US", { month: "long", year: "numeric" }) : y}`;
  } else if (a.between) {
    // two dated reports narrow the birthday to a window
    [earliest, latest] = a.between.map(d => new Date(d + "T00:00"));
  } else if (a.age != null && a.asOf) {
    const t = new Date(a.asOf + "T00:00");
    latest = new Date(t.getFullYear() - a.age, t.getMonth(), t.getDate());
    earliest = new Date(t.getFullYear() - a.age - 1, t.getMonth(), t.getDate() + 1);
    basis = `reported as ${a.age} in ${t.toLocaleDateString("en-US", { month: "long", year: "numeric" })}`;
  } else return null;

  return { text: String(hi), basis, url: a.url, weak: !!a.weak };
}

// ---------- where each contest stands: markets first, then recent polls ----------
function keyFor(result, name) {
  return Object.keys(result || {}).find(k => k === name || name.includes(k) || k.includes(surname(name)));
}
function pollDate(p) {
  const m = String(p.dates || "").match(/([A-Z][a-z]{2})[a-z]*\.?\s+(\d{1,2}).*?(\d{4})/);
  return m ? new Date(`${m[1]} ${m[2]}, ${m[3]}`).getTime() || 0 : 0;
}
function standing(c) {
  const mk = markets && markets.contests[c.id];
  const live = mk ? mk.series.filter(s => !s.thin) : [];
  if (live.length) {
    const p = live.reduce((t, s) => t + s.latest, 0) / live.length;
    return { p, a: pct(p), b: pctRest(p),
      src: live.length === 1 ? `${live[0].platform} betting market` : `Average of ${live.length} betting markets (${live.map(s => s.platform).join(", ")})` };
  }
  const polls = (c.closeness && c.closeness.polls) || [];
  if (c.kind === "race" && c.candidates.length === 2 && polls.length) {
    // average the polls fielded within 60 days of the latest one, so a single sponsor's poll doesn't stand alone
    const newest = Math.max(...polls.map(pollDate));
    const recent = polls.filter(p => newest - pollDate(p) <= 60 * 86400000);
    const shares = recent.map(p => {
      const ka = keyFor(p.result, c.candidates[0].name), kb = keyFor(p.result, c.candidates[1].name);
      return ka && kb ? [p.result[ka], p.result[kb], p] : null;

      const a = shares.reduce((t, s) => t + s[0], 0) / shares.length;
      const b = shares.reduce((t, s) => t + s[1], 0) / shares.length;
      const fmt = v => `${Math.round(v * 10) / 10}%`;
      const who = shares.map(s => s[2].pollster + (s[2].sponsor ? ` for ${s[2].sponsor}` : "")).join("; ");
      return { p: a / (a + b), a: fmt(a), b: fmt(b),

    }

}

    el("button", { class: "rail-btn tab", type: "button", "data-id": c.id, onclick: () => go(c.id) },
      el("span", { class: "rk", text: String(c.rank.n) }),
      el("span", {}, el("span", { class: "nm", text: c.title }), el("span", { class: "sb", text: vsLine(c, " or ") }),
        closePill(c.rank.closeness))))));

    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();

    ...ORDERED.map(c => el("option", { value: c.id, text: `${c.rank.n}. ${c.title}` })),
    el("option", { value: METHOD, text: "How this guide works" }));

  document.getElementById("next").addEventListener("click", () => step(1));

  document.getElementById("asof").textContent = `Researched ${RESEARCHED}.`;
}
function step(d, focus) {
  const i = NAV_IDS.indexOf(state.tab);
  const next = NAV_IDS[Math.max(0, Math.min(NAV_IDS.length - 1, (i < 0 ? 0 : i + d)))];
  go(next);

function syncRail() {

// ---------- picks ----------
const picksFor = id => state.picks[id] || [];
const pickLabel = (c, name) => c.kind === "amendment" ? name : surname(name);
function pickSummary(c) {
  const p = picksFor(c.id).map(n => pickLabel(c, n));
  return p.length ? `Your pick${p.length > 1 ? "s" : ""}: ${p.join(" and ")}` : "";
}
function togglePick(c, name) {
  const cur = picksFor(c.id);
  let next;
  if (cur.includes(name)) next = cur.filter(n => n !== name);
  else if (seatsOf(c) === 1) next = [name];
  else if (cur.length < seatsOf(c)) next = [...cur, name];
  else return;
  if (next.length) state.picks[c.id] = next; else delete state.picks[c.id];
  saveState();
  syncPicks();
}
function pickButton(c, name) {
  const verb = c.kind === "amendment" ? `Vote ${name}` : `Vote for ${surname(name)}`;
  return el("button", { class: "pick", type: "button", "data-pick": name, "data-verb": verb, onclick: () => togglePick(c, name) });
}
// one pass over everything that shows picks: the open page's buttons, the rail, the phone menu
function syncPicks() {
  const c = byId(state.tab);
  if (c) {
    const cur = picksFor(c.id), full = cur.length >= seatsOf(c);
    document.querySelectorAll(".hero .matchup").forEach(m => m.classList.toggle("full", full));
    document.querySelectorAll(".hero [data-pick]").forEach(b => {
      const on = cur.includes(b.dataset.pick);
      b.setAttribute("aria-pressed", String(on));
      b.disabled = full && !on && seatsOf(c) > 1;
      b.textContent = on ? "✓ Your pick" : b.dataset.verb;
      b.title = on ? "Click again to clear" : "";
      b.closest(".side").classList.toggle("picked", on);
    });
  }
  for (const k of CONTESTS) {
    const sb = document.querySelector(`.rail-btn[data-id="${k.id}"] .sb`);
    if (sb) {
      sb.textContent = pickSummary(k) ? `✓ ${pickSummary(k).replace(/^Your picks?: /, "")}` : vsLine(k, " or ");
      sb.classList.toggle("has-pick", !!pickSummary(k));
      // tint the pick red or blue when it's a party candidate (both picks, if two, must share the party)
      const ps = k.kind === "amendment" ? [] : picksFor(k.id).map(n => (k.candidates.find(x => x.name === n) || {}).party);
      sb.dataset.party = ps.length && ps.every(pt => pt === ps[0]) ? PARTY_VAR[ps[0]] || "" : "";
    }
    const opt = document.querySelector(`#picker option[value="${k.id}"]`);
    if (opt) opt.textContent = `${k.rank.n}. ${k.title}${picksFor(k.id).length ? " ✓" : ""}`;

}

function section(key, title, short, ...kids) {

function renderPage() {

  if (spyObs) { spyObs.disconnect(); spyObs = null; }
  page.removeAttribute("style");
  if (state.tab === OVERVIEW) { page.replaceChildren(renderOverview()); return; }
  if (state.tab === METHOD) { page.replaceChildren(renderMethod()); return; }
  const c = byId(state.tab);
  const ci = citer(collectLabels(c));

    (c.noteSources || []).length ? el("p", { class: "fine" }, "Sources: ", c.noteSources.map(s => cite(s.url, s.weak))) : null));
  if (ci.count) secs.push(section("sources", "Sources", "Sources", ci.render()));
  const nav = el("nav", { class: "snav", "aria-label": "Sections" },
    secs.map(s => el("button", { type: "button", "data-for": s.id, text: s.dataset.short,
      onclick: () => s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }) })));
  const ss = c.kind === "amendment" ? null : sideStyle(c);

let spyObs = null;
function spy(nav, secs) {
  const mark = id => nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.for === id ? "true" : "false"));
  mark(secs[0] && secs[0].id);
  spyObs = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];

      mark(vis.target.id);
      const b = nav.querySelector(`[data-for="${vis.target.id}"]`);
      if (b) nav.scrollTo({ left: b.offsetLeft - 16, behavior: "auto" });

// ---------- markets chart ----------
function traded(s) {
  const v = s.volume.toLocaleString("en-US");
  if (s.platform === "Polymarket") return `$${v}`;
  if (s.platform === "Kalshi") return `${v} contracts`;
  return `${v} play-money, ${s.traders} traders`;
}
function drawChartInto(host) {
  const id = host.dataset.chart;
  const c = byId(id);
  if (!markets || !markets.contests[id]) { host.replaceChildren(); return; }
  const mk = markets.contests[id];
  const all = [...mk.series].sort((a, b) => PLATFORM_ORDER.indexOf(a.platform) - PLATFORM_ORDER.indexOf(b.platform));
  const charted = all.filter(s => !s.thin);
  const [aName, bName] = sideNames(c);
  const colorOf = s => `var(${LINE_VAR[s.platform]})`;
  const card = el("div", { class: "chart-card" });

  if (charted.length) {
    const box = el("div");
    const tip = el("div", { class: "tip", role: "status" });
    const lbl = (name, v, up) => el("p", { class: "side-lbl" }, el("i", { style: `background:var(${v})` }),
      c.kind === "amendment"
        ? `${up ? "Upper half" : "Lower half"}: more likely to ${up ? "pass" : "fail"}`
        : `${up ? "Upper half" : "Lower half"}: ${name} more likely to win`);
    card.append(el("p", { class: "fine", style: "margin:0 0 10px" }, "Betting-market odds since the matchups were set."),
      el("div", { class: "chart" }, lbl(aName, "--side-a", true), box, lbl(bName, "--side-b", false), tip));

    const draw = () => {
      const W = Math.max(280, box.clientWidth || 600);
      const H = 220;
      const m = { l: 40, r: W < 520 ? 82 : 104, t: 8, b: 26 };
      const dates = [...new Set(charted.flatMap(s => s.points.map(p => p[0])))].sort();
      const t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]);
      const x = d => m.l + (W - m.l - m.r) * ((Date.parse(d) - t0) / Math.max(1, t1 - t0));
      const y = p => m.t + (H - m.t - m.b) * (1 - p);
      const g = svg("svg", { width: W, height: H, role: "img",
        "aria-label": `Betting-market odds over time for ${c.title}. Latest: ` + charted.map(s => `${s.platform} ${pct(s.latest)} ${aName}`).join(", ") });
      g.append(svg("rect", { x: m.l, y: y(1), width: W - m.l - m.r, height: y(0.5) - y(1), fill: "var(--side-a-soft)" }),
        svg("rect", { x: m.l, y: y(0.5), width: W - m.l - m.r, height: y(0) - y(0.5), fill: "var(--side-b-soft)" }));
      const grid = svg("g", { class: "grid" });
      const axis = svg("g", { class: "axis" });
      for (const v of [0, 0.25, 0.5, 0.75, 1]) {
        grid.append(svg("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: v === 0.5 ? "mid" : null }));
        axis.append(svg("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, v === 0.5 ? "50/50" : pct(v >= 0.5 ? v : 1 - v)));
      }
      const first = new Date(t0);
      for (let d = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + 1)) {
        const iso = d.toISOString().slice(0, 10);
        axis.append(svg("text", { x: x(iso), y: H - 6, "text-anchor": "middle" }, d.toLocaleString("en-US", { month: "short", timeZone: "UTC" })));
      }
      g.append(grid, axis);
      for (const s of charted) {
        const dpath = s.points.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
        g.append(svg("path", { d: dpath, class: "line", stroke: colorOf(s) }));
      }
      // end dots + direct labels, nudged apart with leaders when they collide
      const ends = charted.map(s => ({ s, px: x(s.points[s.points.length - 1][0]), py: y(s.latest), ly: y(s.latest) })).sort((a, b) => a.py - b.py);
      for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 15) ends[i].ly = ends[i - 1].ly + 15;
      const over = ends.length ? ends[ends.length - 1].ly - (H - m.b) : 0;
      if (over > 0) ends.forEach(e => { e.ly -= over; });
      for (const e of ends) {
        const lx = W - m.r + 12;
        if (Math.abs(e.ly - e.py) > 2) g.append(svg("line", { class: "leader", x1: e.px + 5, y1: e.py, x2: lx - 3, y2: e.ly }));
        g.append(svg("circle", { class: "end", cx: e.px, cy: e.py, r: 4.5, fill: colorOf(e.s) }));
        g.append(svg("text", { class: "lbl", x: lx, y: e.ly + 4 }, e.s.platform));
      }
      const xh = svg("line", { class: "xhair", y1: m.t, y2: H - m.b, visibility: "hidden" });
      const hit = svg("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent", tabindex: 0,
        "aria-label": "Odds by date; use left and right arrow keys" });
      g.append(xh, hit);
      let cur = dates.length - 1;
      const show = i => {
        cur = Math.max(0, Math.min(dates.length - 1, i));
        const d = dates[cur];
        xh.setAttribute("x1", x(d)); xh.setAttribute("x2", x(d)); xh.setAttribute("visibility", "visible");
        const rows = charted.map(s => {
          const pt = s.points.find(p => p[0] === d);

          return el("div", { class: "r" }, el("i", { style: `background:${colorOf(s)}` }),
            el("b", { text: `${pct(pt[1] >= 0.5 ? pt[1] : 1 - pt[1])} ${lead}` }), el("span", { text: s.platform }));
        }).filter(Boolean);
        tip.replaceChildren(el("div", { class: "d", text: new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) }), ...rows);
        tip.style.display = "block";

      const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
      const nearest = px => {
        let best = 0, bd = Infinity;
        dates.forEach((d, i) => { const dd = Math.abs(x(d) - px); if (dd < bd) { bd = dd; best = i; } });
        return best;
      };
      hit.addEventListener("pointermove", ev => { const r = g.getBoundingClientRect(); show(nearest(ev.clientX - r.left)); });
      hit.addEventListener("pointerleave", hide);
      hit.addEventListener("focus", () => show(cur));
      hit.addEventListener("blur", hide);
      hit.addEventListener("keydown", ev => {
        if (ev.key === "ArrowLeft") { ev.preventDefault(); show(cur - 1); }
        if (ev.key === "ArrowRight") { ev.preventDefault(); show(cur + 1); }

    };
    requestAnimationFrame(draw);
    let lastW = 0;
    new ResizeObserver(() => { if (box.clientWidth && box.clientWidth !== lastW) { lastW = box.clientWidth; draw(); } }).observe(box);
  }

  // table view: every market, including thin ones that aren't charted
  const asOf = new Date(markets.asOf).toLocaleDateString("en-US", { month: "long", day: "numeric", timeZone: "America/New_York" });
  card.append(el("div", { class: "table-wrap" }, el("table", { class: "data" },
    el("thead", {}, el("tr", {},
      el("th", { text: `Market, latest as of ${asOf}` }),
      el("th", { class: "num", text: aName }), el("th", { class: "num", text: bName }), el("th", { class: "num", text: "Traded" }))),
    el("tbody", {}, all.map(s => el("tr", {},

  card.append(el("p", { class: "fine" },

  host.replaceChildren(card);
